title: kroma
description: Catalogue what you own. Wear what you have. Style with intention.
url: https://kroma.fit
lang: en

# Use a minimal theme — our custom CSS handles the visual design.
theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Jekyll will render markdown files through _layouts/default.html.
# Raw .html files (like index.html) are served as-is.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Posts live at /blog/<slug>/.  Default Jekyll permalink is
# /YYYY/MM/DD/title/ which is ugly and time-stamps the URL; we want
# the post URL to be timeless so we can revise dates without breaking
# inbound links.
permalink: /blog/:slug/

# jekyll-feed config.  Generates /feed.xml on build.  Title and author
# pulled from this file so the feed reader shows "kroma" rather than
# the post title only.
feed:
  path: feed.xml

author:
  name: kroma
  url: https://kroma.fit

# ───────── App store links ─────────
# Used by the "Get kroma" buttons on every guide page and the quiz
# result (_includes/app-buttons.html). Leave a link empty and its
# button shows as "coming soon" instead of a broken link. Paste the
# store URL here on launch day; nothing else needs to change.
#   android: https://play.google.com/store/apps/details?id=fit.kroma.app
#   ios:     the App Store URL from App Store Connect → App Information
app_links:
  android: ""
  ios: ""

# ───────── Feedback page wiring ─────────
# kroma.fit/feedback posts to a Cloudflare Worker that proxies the
# submission into a public GitHub issue under a bot account. The page
# detects when these values are placeholders and shows a "coming soon"
# notice instead of a broken form.
#
# Set these once the Worker is deployed:
#   1. feedback_api_url — the deployed worker URL (e.g.
#      https://kroma-feedback.<subdomain>.workers.dev OR a custom
#      domain like https://feedback-api.kroma.fit).
#   2. turnstile_site_key — the PUBLIC Cloudflare Turnstile site key
#      (the secret key is set as a Cloudflare Worker secret, not here).
# See cloudflare-worker/README.md for the full setup checklist.
feedback_api_url: "https://kroma-feedback.kroma-fit-app.workers.dev"
turnstile_site_key: "0x4AAAAAADPaJlhSA6FA11nD"

# Exclude files that shouldn't be published.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - "cloudflare-worker"
  - "*.gen.js"
  - "compress-*.mjs"
